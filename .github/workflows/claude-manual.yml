name: Claude - approved development task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One narrowly scoped task, including acceptance criteria (avoid secrets)"
        required: true
        type: string
      use_opus:
        description: "Use Opus as the coding executor for unusually complex tasks (higher cost)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: claude-manual-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow AGENTS.md and project.md strictly.
            Perform only this manually approved development task:
            ${{ inputs.task }}
            Work on a branch and open a PR for review; do not merge.
            Update project.md progress only for tested changes.
          claude_args: |
            --model ${{ inputs.use_opus && 'opus' || 'sonnet' }}
            --max-turns 30
            --permission-mode auto
            --allowedTools "Bash(npm install),Bash(npm run:*),Bash(npx tsc:*),Bash(npx eslint:*),Bash(npx vitest:*),Edit,Write"
