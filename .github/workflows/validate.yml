name: Validate

# Runs on pull requests only, to save Actions minutes: every change reaches main through a
# validated PR. A run can also be started by hand from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run still in progress.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
